<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMD Chat</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <button id="newchat" class="newchat">＋ 新对话</button>
      <button id="closeSide" class="icon-btn" title="收起">×</button>
    </div>
    <div class="side-list" id="sideList"></div>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <div class="main">
  <header class="topbar">
    <button id="openSide" class="icon-btn" title="会话列表">☰</button>
    <div class="brand">AMD <span>Chat</span></div>

    <div class="controls">
      <label class="ctl">
        <span>模型</span>
        <select id="model"></select>
      </label>
      <label class="ctl">
        <span>思考</span>
        <select id="effort">
          <option value="none">none</option>
          <option value="minimal">minimal</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
        </select>
      </label>
      <span id="conn" class="conn" title="后端连接状态">●</span>
    </div>
  </header>

  <main id="messages" class="messages">
    <div class="welcome" id="welcome">
      <h1>开始对话</h1>
      <p>连续多轮对话，流式输出。Enter 发送，Shift+Enter 换行。</p>
      <p class="hint">AMD 开发者门户接口（rpm 20/min）· 常驻连接 · 不重试不并发</p>
    </div>
  </main>

  <footer class="composer">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送…"></textarea>
      <button id="send" class="send" title="发送 (Enter)">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.993.993 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
      </button>
      <button id="stop" class="stop hidden" title="停止生成">
        <svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="status" id="status"></div>
  </footer>
  </div>
</div>
<script src="/markdown.js"></script>
<script src="/app.js"></script>
</body>
</html>
